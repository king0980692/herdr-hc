name: herdr-hc release

# Private-fork release of the `hc-entry` (herdr-hc) and Native (herdr-native)
# builds. A `herdr-hc-*` tag runs the Linux and macOS checks first; only then
# are the platform binaries (Windows included, untested) built and published
# as a prerelease of this repository.
# Never matches the upstream `preview-*`/`v*` tags.
on:
  push:
    tags:
      - "herdr-hc-*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

concurrency:
  group: herdr-hc-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same checks as CI on Linux and macOS, run here so a Windows test gap
  # (no hc on Windows runners yet) does not block the Unix releases.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            filter: all()
          - os: macos-latest
            filter: not binary(live_handoff)
    env:
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt,clippy

      - name: Install Rust tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just,cargo-nextest

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Checkout pinned hc test runtime
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: herdrdev/herdr-core
          ref: de97ea5ba5d6877a5e082316b4a1a5b4918e861f # hc 0.1.20
          path: .local/hc-test-source
          submodules: true
          persist-credentials: false

      - name: Build isolated-test hc executable
        run: |
          cargo build --locked --manifest-path .local/hc-test-source/Cargo.toml -p herdr-core
          mkdir -p "$RUNNER_TEMP/herdr-hc-test-bin"
          ln -s "$GITHUB_WORKSPACE/.local/hc-test-source/target/debug/herdr-core" "$RUNNER_TEMP/herdr-hc-test-bin/hc"
          echo "$RUNNER_TEMP/herdr-hc-test-bin" >> "$GITHUB_PATH"

      - name: Lint
        run: just lint

      - name: Lint the hc-entry build
        run: cargo clippy --all-targets --locked --features hc-entry -- -D warnings

      - name: Tests
        run: just ci-tests '${{ matrix.filter }}'

      - name: Check scalar libghostty with runtime safety
        if: runner.os == 'Linux'
        env:
          LIBGHOSTTY_VT_SIMD: "false"
          LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
        run: cargo nextest run --locked -E 'package(ghostty-vt) | test(ghostty)' --status-level fail --final-status-level fail --failure-output final --success-output never

  build-unix:
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [hc, native]
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-aarch64
          # herdr-hc: this machine's Local core only. herdr-native: the full
          # Native frontend (shared machine catalog, shared herdr.app layout).
          - variant: hc
            features: --features hc-entry
          - variant: native
            features: ''
    env:
      NAME: herdr-${{ matrix.variant }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        # Keep the runner's own (Azure) mirror: ubuntu-latest runners could not
        # resolve archive/security.ubuntu.com once it was removed.
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked ${{ matrix.features }} --target ${{ matrix.target }}

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/herdr "$NAME"
          file "$NAME" > "$NAME.BUILD_INFO.txt"
          if [ "$RUNNER_OS" = Linux ]; then
            ldd "$NAME" 2>&1 | tee -a "$NAME.BUILD_INFO.txt"
            grep -q "statically linked" "$NAME.BUILD_INFO.txt"
          fi
          {
            echo "commit=$GITHUB_SHA"
            echo "target=${{ matrix.target }}"
            echo "variant=${{ matrix.variant }}"
            echo "features=${{ matrix.features }}"
          } >> "$NAME.BUILD_INFO.txt"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}
            ${{ env.NAME }}.BUILD_INFO.txt
          retention-days: 14

  build-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: hc
            features: --features hc-entry
          - variant: native
            features: ''
    env:
      NAME: herdr-${{ matrix.variant }}-windows-x86_64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Remove Zig caches
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/zig-out -ErrorAction SilentlyContinue

      - name: Build
        run: cargo build --release --locked ${{ matrix.features }} --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP $env:NAME
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\x86_64-pc-windows-msvc\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath "$env:NAME.zip"
          "commit=$env:GITHUB_SHA" | Out-File -Encoding utf8 "$env:NAME.BUILD_INFO.txt"
          "target=x86_64-pc-windows-msvc" | Out-File -Encoding utf8 -Append "$env:NAME.BUILD_INFO.txt"
          "variant=${{ matrix.variant }}" | Out-File -Encoding utf8 -Append "$env:NAME.BUILD_INFO.txt"
          "features=${{ matrix.features }}" | Out-File -Encoding utf8 -Append "$env:NAME.BUILD_INFO.txt"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.zip
            ${{ env.NAME }}.BUILD_INFO.txt
          retention-days: 14

  release:
    needs: [build-unix, build-windows]
    if: startsWith(github.ref, 'refs/tags/herdr-hc-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum herdr-hc-* herdr-native-* | grep -v BUILD_INFO > SHA256SUMS
          cat SHA256SUMS

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          Builds of \`$GITHUB_SHA\`, after the Linux and macOS test suites passed.

          - \`herdr-hc-*\` (\`--features hc-entry\`): a Native view of this machine's
            Local hc core only.
          - \`herdr-native-*\`: the full Native frontend (shared machine catalog;
            Native viewers on one core share herdr.app's \`herdr-app\` layout).

          Both need an hc core with \`automatic_input\` (hc 0.1.18 or newer).
          macOS binaries are unsigned.
          Windows is built but untested: its CI has no hc yet, so neither the
          test suite nor a live run has exercised it.
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "$TAG" \
            --notes-file notes.md
